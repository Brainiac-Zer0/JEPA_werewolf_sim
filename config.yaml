LLM_PROVIDER: openai
NUM_AGENTS: 9
NUM_WEREWOLVES: 2
WEREWOLF: Werewolf
VILLAGER: Worker
ROLE_PRIORS:
  WEREWOLF: ones
  VILLAGER: zeros
RUN_SEED: 1337
PERSONA_SCALE: 0.2
PERSONA_SEED: null
PERSONA_CONFIG_PATH: configs/persona_vectors.yaml
INCLUDE_RATIONALE: true
ENABLE_PERSONA_STEER: true
# Scale on the persona->talk-intent bias (RQ5). 0 disables; 1.0 default.
PERSONA_STEER_SCALE: 1.0
DEBUG: false
debug:
  llm_gate_strict: false
INPUT_DIM: 823   # 808 base + 15 identity (1 role bit + 9 self one-hot + 5 persona), see package_features/§3.3
IDENTITY_SCALE: 6.0
LATENT_DIM: 32
ACTION_DIM: 8
NUM_ACTIONS: 6
ACTION_EMBED_DIM: 8
ACTION_EMBED_KIND: onehot
WORLD_INPUT_MODE: z_plus_action
paths:
  checklists: null
  checkpoints: checkpoints/
  logs: logs/
  rubric: judge_rubric.yaml
  mouthpiece: checkpoints/speakers/
CHECKPOINT_DIR: checkpoints
RUBRIC_PATH: judge_rubric.yaml
JUDGE_RUBRIC_PATH: judge_rubric.yaml
SCREEN_W: 1200
SCREEN_H: 600
FPS: 1
AGENT_R: 30
MSG_LOG_LIMIT: 12
MSG_BOX_W: 360
MSG_BOX_X: 840
sim:
  num_agents: 9
  num_werewolves: 2
  planner_topk: 3
  use_language: true
  discuss_turns: 2
  vote_mix_alpha: 0.45
  log_dz_talk: false
  log_dz_kill: false
  voting:
    mode: random
    random:
      enabled: true
      seed: null
    heuristic:
      enabled: false
      name: suspicion_top1
  ui:
    enabled: true
    screen_w: 1200
    screen_h: 600
    fps: 1
    msg_log_limit: 12
    msg_box_w: 360
  social:
    enabled: true
    hidden: 64
    scale: 0.05
    window: 2
    K: 6
    apply_between: discuss_vote
    trust: cosine
    lambda_reg: 0.001
    tau: 0.25
    max_step: 0.25
  env_aliases:
    SOC_ENABLED: true
    SOC_SCALE: 0.05
    SOC_K: 6
    VOTE_MODE: ''
    RANDOM_VOTE: 0
    HEURISTIC_VOTE: 0
  night_chat:
    enabled: false
    turns: 2
    judge_on: false
    ui_preview: false
    intent_target: top1
    use_bias_fusion: true
    delta_social_scale: 1.0
  talk_mask_all: true
  talk_fusion_alpha: 0.5
  phases:
    night_enabled: true
phases:
  talk_categories:
  - accuse
  - defend
  - hedge
  - question
  - vote
model:
  input_dim: 811
  latent_dim: 32
  action_dim: 8
  num_actions: 6
  encoders:
    message_model: sentence-transformers/all-MiniLM-L6-v2
  phases:
    count: 3
    talk_categories:
    - accuse
    - defend
    - hedge
    - question
    - vote
    num_talk_cats: 5
  factorized_planner:
    temperature: 1.0
    masks:
      mask_self: true
      mask_dead: true
      kill_wolves_only: true
coalitions:
  compare: false
  shared_kill: true
  hidden: 64
JUDGE_MODEL_ID: gpt-4o-mini   # non-reasoning judge (~5-10x cheaper than o4-mini); rubric scoring needs no reasoning tokens
JUDGE_MAX_NEW: 128
JUDGE_DEBUG: false
JUDGE_DEBUG_DIR: logs
JUDGE_DEVICE: auto
JUDGE_BATCH: 4
openai:
  model: o4-mini
  max_tokens: 128
  max_output_tokens: 128
  temperature: null
  presence_penalty: null
  frequency_penalty: null
  system: "You are the mouthpiece for a social-deduction agent. Speak in-character\
    \ in 1\u20132 concise sentences, never reveal hidden info, avoid OOC or meta."
judge_openai:
  model: gpt-4o-mini
  max_tokens: 256
  temperature: null
  presence_penalty: null
  frequency_penalty: null
  system: You are a strict scoring judge. Return JSON only with subscores and a final
    score.
judge:
  model_id: gpt-4o-mini
  device: auto
  batch: 4
  max_new: 128
  include_rationale: true
  enable_persona_steer: false
  debug: false
  debug_dir: logs
  rerank_topk: true
  store_subscores: true
  talk_vote_alignment: true
  rp_weight: 0.15
  rp_n: 2
  temperature: null
  presence_penalty: null
  frequency_penalty: null
LLM_MODEL_ID: o4-mini
LLM_SPEAKER: true
LLM_DEVICE: auto
llm:
  provider: openai
  model_id: o4-mini
  device: auto
  dtype: auto
  load_in_8bit: true
  load_in_4bit: false
  max_seq: 4096
  kv_cache: true
  speaker_enabled: true
  max_new_tokens: 80
  min_new_tokens: 16
  temperature: 0.8
  top_p: 0.92
  repetition_penalty: 1.08
  no_repeat_ngram_size: 3
  hf_decoding:
    temperature: 0.7
    top_p: 0.9
    repetition_penalty: 1.15
    no_repeat_ngram_size: 3
    attempts:
    - temperature: 0.7
      top_p: 0.9
      repetition_penalty: 1.15
      no_repeat_ngram_size: 3
      max_new_tokens: 96
      min_new_tokens: 12
    - temperature: 0.8
      top_p: 0.9
      repetition_penalty: 1.12
      no_repeat_ngram_size: 4
      max_new_tokens: 72
      min_new_tokens: 12
  openai:
    max_output_tokens: 128
    stop:
    - </s>
    - '###'
    - '[OOC]'
    - 'Out of character:'
  bans_meta:
  - Use
  - Do not
  - Don't
  - 'No '
  - 'Keep '
  - Reply
  - Provide
  - Follow
  - Instruction
  - Rule
  - sentence
  - third person
  - grammar
  - punctuation
  - No narration
  hygiene:
    trim_quotes: true
    strip_role_words: true
  encoders:
    context:
      window: 6
      decay: 0.85
      self_gate: 1.15
      other_gate: 1.0
      add_role_bit: true
      l2_norm: true
    text:
      l2_norm: true
      cache_size: 8192
  regularization:
    talk_entropy_w: 0.0
    talk_kl_uniform_w: 0.0
  presence_penalty: 0.1
language:
  min_words: 12
  style_contract: true
  hedges_cap_per5: 2
  intensifiers_cap_per5: 2
  discourse_markers_cap_per5: 2
  bigram_penalty: 1.1
  trigram_veto: true
  contraction_normalize: true
  question_prior_beta: 0.2
  force_question_prob: 0.35
  guard_hidden_info: true
  redo_max: 3
  exemplar_pack: p7_default
  banned_bigrams:
  - I believe
  - Based on
fusion:
  alpha_intent_bias: 0.65
speaker:
  enabled: true
  lr: 0.001
  hist_k: 3
  entropy_bonus: 0.01
  hidden: 128
  warmup_steps: 100
  fusion_alpha: 0.5
  lambda_j: 1.0
  lambda_c: 0.25
  lambda_o: 0.2
bias_head:
  latent_dim: 32
  lr: 0.0005
  epochs: 1
  strength_cap: 2.0
  cat_order:
  - accuse
  - defend
  - hedge
  - question
  - vote
  regularizer_lambda: 0.0
DEFAULT_LEXICON:
  accuse:
  - accuse
  - suspicious
  - suspect
  - lying
  - deceive
  - eliminate
  - vote
  defend:
  - defend
  - innocent
  - trust
  - ally
  - support
  - clear
  hedge:
  - maybe
  - perhaps
  - uncertain
  - unsure
  - might
  - seems
  - appears
  question:
  - why
  - how
  - what
  - who
  - where
  - when
  - '?'
  vote:
  - vote
  - eliminate
  - banish
  - target
  - lynch
CAT_ORDER:
- accuse
- defend
- hedge
- question
- vote
ENTROPY_ATTENUATION: 0.5
PER_CAT_SCALES:
  question: 1.1
  vote: 0.95
EXTRA_LEXICON: {}
STRICT_LEXICON: false
TALK_FUSION_ALPHA: 0.5
DEFAULT_TEMPLATES:
- Accuse {target}
- Defend {ally}
- Ask {target} a question
- Express uncertainty
- Propose vote on {target}
templates:
- Accuse {target}
- Defend {ally}
- Ask {target} a question
- Express uncertainty
- Propose vote on {target}
N_GAMES: 50
PHASE_COUNT: 3
TURNS_DAY_DISCUSS: 2
NUM_TALK_CATS: 5
TALK_CATEGORIES:
- accuse
- defend
- hedge
- question
- vote
STRATIFY_PHASE_BATCHES: true
training:
  mode: factorized
  n_games: 3
  outer_cycles: 1
  games_per_cycle: 1
  epochs: 2
  batch_size: 64
  lr: 0.001
  max_grad_norm: 1.0
  lambda_bc: 0.5
  lambda_talk: 0.5
  # Experimental VICReg-style variance hinge on the belief encoder. Disabled by
  # default: without scale control it caused the latent norm to explode. The
  # encoder's output LayerNorm now bounds the scale instead. 0 disables.
  var_reg_w: 0.0
  device: auto
  speaker_enabled: true
  speaker_only: false
exploration:
  epsilon: 0.05
  ucb_c: 1.414
ablations:
  judge: true
  bandit: false
  personas: true
  social: true
  fep_core: true
  language: true
  random_vote: false
  heuristic_vote: false
determinism:
  enabled: true
  seed: 1337
  torch_deterministic: true
  cudnn_benchmark: false
seed: 1337
seeds:
  global: 1337
telemetry:
  enabled: true
  out_dir: logs
  csv_name: telemetry.csv
  judge_jsonl_name: judge_calls.jsonl
  snapshot_config: true
  print_summary: true
  flush_every: 1
logging:
  judge_jsonl: logs/judge_calls.jsonl
  debug: false
runtime:
  save_config_snapshot: true
# Top-level encoders config (read by encoders.py as config["encoders"]).
encoders:
  regularization:
    # FEP-inspired planner regularization (RQ2), consumed in train_jepa_factorized.
    # talk_entropy_w penalizes talk-intent entropy (more decisive planning);
    # talk_kl_uniform_w pulls toward a uniform prior (preserves exploration).
    talk_entropy_w: 0.01
    talk_kl_uniform_w: 0.0
PHASE_AWARE_JEPA: true
TRAIN_PHASE_HEADS: true
TELEMETRY_ENABLED: true
LANGUAGE_COUPLING:
  enabled: true
  loss_weight: 0.05
MOUTHPIECE_REWARD_WEIGHTS:
  coherence: 0.4
  role_alignment: 0.3
  social_safety: 0.15
  truthfulness_villager: 0.15
  deception_wolf: 0.3
  talk_vote_alignment: 0.1
REWARD_USE_ROLE_ALIGNMENT: false
MOUTHPIECE_TRAINING:
  speaker_bandit_lr: 0.0005
  speaker_bandit_epochs: 1
  speaker_bandit_entropy_reg: 0.01
  speaker_bandit_baseline_ema: 0.9
  speaker_bandit_kl_to_intent: 0.01
  speaker_bandit_arg_aux_weight: 0.25
  bias_head_lr: 0.0005
  bias_head_epochs: 1
  bias_head_entropy_reg: 0.005
  bias_head_kl_reg: 0.0
  bias_head_kl_to_intent: 0.01
prompting:
  include_round: true
  include_phase: true
  include_role: true
  include_context_window: 8
  include_alive_list: true
  include_vote_history: true
  include_night_history: true
  system_style: natural
  guardrails:
    taboo_night_identity: true
    avoid_ooc: true
    stay_in_phase: true
PLANNER_TOPK: 3
BIAS_CAP: 2.0
BASE_STRENGTH: 1.0
USE_AMP: false
LR_SCHEDULER: none
SAVE_OPTIM: false
DEBUG_MASKS: false
social:
  enabled: true
  # scale/max_step set so the trained social correction is a meaningful fraction of
  # ||z|| (~10-25%) instead of the previous inert ~0.2%. The planner trains WITH the
  # correction present, so it adapts; lambda_reg bounds ||delta||.
  scale: 0.15               # ||delta|| as a fraction of ||z_self|| (relative)
  window: 1
  lambda_reg: 0.001
  # Weight on the wolf-supervision term that trains delta_social to shift villager
  # votes toward the actual wolves (peer-informed wolf detection). This is what
  # makes the social correction a genuine positive component (B1 > B2).
  wolf_supervision_w: 0.5
  trust: cosine
  tau: 0.5
  max_step: 0.5
  # Weight on the wolf-supervision term that trains δ_social to shift villager votes
  # toward the actual wolves (makes social an effective, non-inert component).
  wolf_supervision_w: 0.5
social_influence:
  enabled: true
  K: 6
  scale: 1.0
JUDGE_PROVIDER: openai
